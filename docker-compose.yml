services:
  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    environment:
      secret_key: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    env_file:
      - ./src/frontend/.env
    volumes:
      - react_static:/usr/share/caddy
  

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Caddy a accès aux fichiers du front grâce au volume partagé
      - react_static:/usr/share/caddy/frontend:ro 
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend


volumes:
  react_static: # Le fameux volume partagé pour le HTML/CSS/JS
  caddy_data:
  caddy_config:
